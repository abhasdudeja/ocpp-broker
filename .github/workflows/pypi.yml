name: pypi

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  release:
    types: [published]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Verify package structure
      run: |
        pip install twine
        twine check dist/*

    - name: Install package and test dependencies
      run: |
        pip install dist/*.whl
        pip install .[tests]

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-python-${{ matrix.python-version }}
        path: dist/
        retention-days: 1

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: default 
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') || github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Debug secret existence
      run: |
        if [ -z "${{ secrets.PYPI_API_TOKEN }}" ]; then echo "SECRET IS EMPTY"; else echo "SECRET EXISTS"; fi
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/* --verbose

