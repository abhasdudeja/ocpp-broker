name: pypi

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  release:
    types: [published]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install package with test and lint dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[tests,lint]"

    - name: Ruff
      run: ruff check src tests scripts

    - name: Mypy
      run: mypy

  ui:
    # The web console (ui/): checks, then the build that the wheel ships.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Install
      run: npm ci

    - name: ESLint
      run: npm run lint

    - name: Type check
      run: npm run typecheck

    - name: Unit tests
      run: npm test

    - name: Generated API types are current
      # ui/openapi.json is checked against the broker by tests/test_openapi_contract.py;
      # this checks that the TypeScript types were generated from it.
      run: |
        npm run api
        git diff --exit-code -- src/api/schema.d.ts

    - name: Build
      run: npm run build

    - name: Keep the build for the package
      uses: actions/upload-artifact@v4
      with:
        name: ui-dist
        path: src/ocpp_broker/ui_dist
        retention-days: 1

  mongo-tests:
    # The transaction id store and the history queries against a real MongoDB: index definitions,
    # TTL indexes, sorting and paging, and BSON round trips, which the in-memory fake used elsewhere cannot show.
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OCPP_TEST_MONGO_URI: mongodb://localhost:27017
      OCPP_TEST_MONGO_TTL_WAIT: '180'  # MongoDB's TTL monitor runs about once a minute

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install package with test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[tests]"

    - name: Run the MongoDB tests
      run: pytest tests/test_transaction_store_mongo.py tests/test_history_mongo.py -v --tb=short

  build-and-test:
    needs: ui
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Get the built web console
      uses: actions/download-artifact@v4
      with:
        name: ui-dist
        path: src/ocpp_broker/ui_dist

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Verify package structure
      run: |
        pip install twine
        twine check dist/*

    - name: The wheel contains the web console
      run: |
        unzip -l dist/*.whl | grep -q 'ocpp_broker/ui_dist/index.html'
        unzip -l dist/*.whl | grep -q 'ocpp_broker/ui_dist/assets/'

    - name: Install package and test dependencies
      run: |
        pip install dist/*.whl
        pip install .[tests]

    - name: The installed package finds its web console
      # from another directory, so the source tree is not what gets imported
      working-directory: ${{ runner.temp }}
      run: python -c "from ocpp_broker import ui; assert ui.ui_built(), ui.DIST_DIR"

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-python-${{ matrix.python-version }}
        path: dist/
        retention-days: 1

  publish:
    needs: [lint, ui, build-and-test, mongo-tests]
    runs-on: ubuntu-latest
    environment: default
    if: github.event_name == 'release'

    steps:
    - uses: actions/checkout@v4

    - name: Get the built web console
      uses: actions/download-artifact@v4
      with:
        name: ui-dist
        path: src/ocpp_broker/ui_dist

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Debug secret existence
      run: |
        if [ -z "${{ secrets.PYPI_API_TOKEN }}" ]; then echo "SECRET IS EMPTY"; else echo "SECRET EXISTS"; fi
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/* --verbose

