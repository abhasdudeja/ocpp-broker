# OCPP Broker configuration
# Every setting below is read by the broker; see docs/configuration.md for the full reference.
# Start with:  ocpp-broker-server -c config.yaml

# =============================================================================
# BROKER
# =============================================================================
# One port serves the charger WebSocket (ws://HOST:PORT/{org}/{charger id}),
# the REST API, /health and the Swagger UI (/docs).
broker:
  host: 0.0.0.0
  port: 8765

# =============================================================================
# SECURITY
# =============================================================================
# The REST API (/api/..., /orgs/...) needs an API key. Set it here or,
# preferably, in the environment:
#   OCPP_BROKER_API_KEY=<long random string>
# Clients send it as "X-API-Key: <key>" (or "Authorization: Bearer <key>").
# With no key configured every REST request returns 503 (fails closed).
security:
  # api_key: "change-me"
  # allow_unauthenticated_api: false   # true = open REST API (development only)
  cors:
    allow_origins: []            # explicit origins, e.g. ["https://dashboard.example.com"]
    allow_credentials: false     # never combinable with "*"
  websocket:
    ping_interval: 20            # seconds between pings to chargers
    ping_timeout: 20             # a charger that does not answer a ping in time is dropped

# =============================================================================
# ORGANIZATIONS
# =============================================================================
# connect_to_backend is true by default, so always set it explicitly:
#   false = broker mode: the broker is the central system (orgA below)
#   true  = relay mode: frames are forwarded to your backends (orgB below)
organizations:
  # ---------------------------------------------------------------------------
  # Broker mode
  # ---------------------------------------------------------------------------
  - name: "orgA"
    connect_to_backend: false
    ocpp_subprotocol: "ocpp1.6"    # subprotocol chargers must request (default)
    # Charger authentication: HTTP Basic on the WebSocket upgrade (OCPP security
    # profile 1). The username must be the charger id in the URL. Once an
    # organization lists credentials, only those chargers may connect.
    # Generate a hash with:  python -m ocpp_broker.auth
    # charger_auth:
    #   credentials:
    #     CP001:
    #       password_hash: "pbkdf2_sha256$200000$<salt>$<hash>"
    #     CP002:
    #       password: "plaintext-works-but-is-discouraged"
    # Authorization tags, used for Authorize / StartTransaction
    tags:
      - id_tag: "ADMIN001"
        status: "Accepted"
        tag_type: "RFID"
        description: "Administrator access card"
        metadata:
          role: "admin"
          department: "IT"

  # ---------------------------------------------------------------------------
  # Relay mode: replace the example URLs with your central system(s)
  # ---------------------------------------------------------------------------
  - name: "orgB"
    connect_to_backend: true
    ocpp_subprotocol: "ocpp1.6"
    backends:
      # The broker connects to {url}/{charger id} for every charger.
      - id: main
        url: ws://backend.example.com/ocpp
        leader: true               # the leader talks to the charger
      # - id: observer             # followers receive a copy of the charger's requests
      #   url: ws://observer.example.com/ocpp
    # Relay resilience (all optional; defaults shown)
    # backend_buffer_size: 200       # frames held while the leader is unreachable
    # backend_outage_timeout: 30     # seconds before a held request is answered with a CallError
    # leader_failover_timeout: 15    # seconds the leader may be down before a follower takes over (0 = never)

# =============================================================================
# OCPP 1.6
# =============================================================================
ocpp:
  commands:
    core:
      heartbeat_interval: 20  # seconds; sent as `interval` in the BootNotification reply (broker mode; default 300)

# =============================================================================
# DATATRANSFER (system-wide, broker mode)
# =============================================================================
data_transfer:
  # Vendor ids that may send DataTransfer; others are answered UnknownVendorId
  known_vendors:
    - "ABB"
    - "generalConfiguration"
    - "Schneider"
    - "Siemens"
    - "VendorA"
    - "VendorB"
    - "VendorC"
  # Message ids that are allowed; others are answered UnknownMessageId
  known_message_ids:
    - "MSG001"
    - "setMeterConfiguration"
    - "MSG002"
    - "MSG003"
    - "DiagnosticsRequest"
    - "FirmwareStatus"
    - "CustomData"
  validate_vendors: true        # default true
  validate_message_ids: true    # default true
  vendors:
    VendorA:
      allowed_message_ids:      # optional: restrict this vendor to these message ids
        - "MSG001"
        - "MSG002"
      auto_accept: true         # default true; false answers Rejected
      require_message_id: false # default false
    VendorB:
      allowed_message_ids:
        - "MSG003"
        - "DiagnosticsRequest"
      auto_accept: true
      require_message_id: true  # answers UnknownMessageId when no message id is sent
  # Per vendor+message overrides
  vendor_messages:
    "VendorA:MSG001":
      auto_accept: true
    "VendorB:DiagnosticsRequest":
      auto_accept: true

# =============================================================================
# MONGODB (optional)
# =============================================================================
# Without MongoDB nothing is persisted and transaction ids are not durable.
# Set enabled: false (or remove this section) if you have no MongoDB.
mongodb:
  enabled: true
  connection_string: "mongodb://localhost:27017"
  database_name: "ocpp_broker"
  # What is kept of the traffic (see docs/mongodb-integration.md#history). Defaults shown.
  # history:
  #   messages: false        # true: every OCPP frame goes to ocpp_messages (one write each)
  #   heartbeats: false
  #   retention_days: {messages: 30, commands: 365}   # TTL per collection; null = for ever
