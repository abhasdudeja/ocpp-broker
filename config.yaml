# OCPP Broker Unified Configuration
# This configuration combines all broker features: OCPP 1.6, tag management, and multi-organization support

# =============================================================================
# BROKER CORE SETTINGS
# =============================================================================
broker:
  host: 0.0.0.0
  port: 8765
  ocpp_version: "1.6"

# =============================================================================
# SECURITY
# =============================================================================
# The REST API (/api/..., /orgs/...) is served on the broker port above and
# needs an API key. Set it here or, preferably, in the environment:
#   OCPP_BROKER_API_KEY=<long random string>
# Clients send it as "X-API-Key: <key>" (or "Authorization: Bearer <key>").
# With no key configured every REST request returns 503 (fails closed).
security:
  # api_key: "change-me"
  # allow_unauthenticated_api: false   # true = open REST API (development only)
  cors:
    allow_origins: []            # explicit origins, e.g. ["https://dashboard.example.com"]
    allow_credentials: false     # never combinable with "*"
  websocket:
    ping_interval: 20            # seconds between pings to chargers
    ping_timeout: 20             # a charger that does not answer a ping in time is dropped
# =============================================================================
# ORGANIZATIONS CONFIGURATION
# =============================================================================
organizations:
  # Organization A: External Backend Mode
  - name: "orgA"
    connect_to_backend: false   # ✅ Will connect to external backends
    ocpp_subprotocol: "ocpp1.6"  # OCPP WebSocket subprotocol (e.g., "ocpp1.6", "ocpp2.0.1")
    # Relay resilience (all optional; defaults shown)
    # backend_buffer_size: 200       # frames held while the backend is unreachable
    # backend_outage_timeout: 30     # seconds before a held CALL is answered with a CallError
    # leader_failover_timeout: 15    # seconds the leader may be down before a follower takes over (0 = never)
    # Charger authentication: HTTP Basic on the WebSocket upgrade (OCPP security
    # profile 1). The username must be the charger id in the URL. Once an
    # organization lists credentials, only those chargers may connect.
    # Generate a hash with:  python -m ocpp_broker.auth
    # charger_auth:
    #   credentials:
    #     SLTEST01:
    #       password_hash: "pbkdf2_sha256$200000$<salt>$<hash>"
    #     SLTEST02:
    #       password: "plaintext-works-but-is-discouraged"    # Tag management for external backend mode
    tag_management:
      enabled: true
    # Pre-configured tags
    tags:
      - id_tag: "ADMIN001"
        status: "Accepted"
        tag_type: "RFID"
        description: "Administrator access card"
        metadata:
          role: "admin"
          department: "IT"
    backends:
      - id: backendA1
        url: ws://ocppmgl.ev-opt.com/EV/EDMS
        leader: true
        ocpp_subprotocol: "ocpp1.6"  # Backend-specific subprotocol (overrides org-level)
        chargers:
          - SLTEST01
          - SLTEST02

# =============================================================================
# OCPP 1.6 SPECIFIC CONFIGURATION
# =============================================================================
ocpp:
  # Command handling settings
  commands:
    # Core Profile settings
    core:
      heartbeat_interval: 20  # 20 seconds

# =============================================================================
# DATATRANSFER CONFIGURATION (System-wide)
# =============================================================================
data_transfer:
  # List of known vendor IDs that are allowed to send DataTransfer commands
  known_vendors:
    - "ABB"
    - "generalConfiguration"
    - "Schneider"
    - "Siemens"
    - "VendorA"
    - "VendorB"
    - "VendorC"
  # List of known message IDs that are allowed in DataTransfer commands
  known_message_ids:
    - "MSG001"
    - "setMeterConfiguration"
    - "MSG002"
    - "MSG003"
    - "DiagnosticsRequest"
    - "FirmwareStatus"
    - "CustomData"
  # Enable/disable validation (default: true)
  validate_vendors: true
  validate_message_ids: true
  # Vendor-specific configurations
  vendors:
    VendorA:
      # Optional: specific message IDs allowed for this vendor
      allowed_message_ids:
        - "MSG001"
        - "MSG002"
      # Auto-accept messages from this vendor (default: true)
      auto_accept: true
      # Require message_id for this vendor (default: false)
      require_message_id: false
    VendorB:
      allowed_message_ids:
        - "MSG003"
        - "DiagnosticsRequest"
      auto_accept: true
      require_message_id: true  # This vendor requires message_id
  # Vendor+Message ID specific configurations (optional)
  vendor_messages:
    "VendorA:MSG001":
      auto_accept: true
      description: "Diagnostics data from VendorA"
    "VendorB:DiagnosticsRequest":
      auto_accept: true
      description: "Diagnostics request from VendorB"

# =============================================================================
# TAG MANAGEMENT CONFIGURATION
# =============================================================================
tag_management:
  # Global tag management settings
  global:
    enabled: true

# =============================================================================
# MONGODB CONFIGURATION
# =============================================================================
mongodb:
  enabled: true  # Set to false to disable MongoDB integration
  connection_string: "mongodb://localhost:27017"  # MongoDB connection string
  database_name: "ocpp_broker"  # Database name to use

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging:
  level: "INFO"
