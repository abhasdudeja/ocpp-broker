[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocpp-broker"
version = "0.2.0a0"
description = "A middleware OCPP broker for forwarding messages between chargers and backends"
authors = [
  { name = "Abhas Dudeja", email = "amdudeja@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "websockets>=11.0",
  "pyyaml>=6.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0"
]

# 👇 This is the CRITICAL FIX
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ocpp_broker" = ["docs/*.md"]

[project.scripts]
ocpp-broker-server = "ocpp_broker.server:main"