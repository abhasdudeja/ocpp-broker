[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocpp-broker"
version = "0.5"
description = "A comprehensive OCPP broker with tag management, message routing, and backend integration"
authors = [
  { name = "Abhas Dudeja", email = "amdudeja@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "websockets>=11.0",
  "pyyaml>=6.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.29.0",
  "ocpp>=1.0.0",
  "motor>=3.3.0",
  "pymongo>=4.6.0",
  "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
tests = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.25.0",
  "websockets>=14.0"  # the integration tests use the asyncio server/client API
]
lint = [
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "types-PyYAML"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The built web console (npm run build in ui/). Not committed; CI builds it before the wheel.
"ocpp_broker" = ["ui_dist/**/*"]

[project.scripts]
ocpp-broker-server = "ocpp_broker.server:main"
ocpp-broker-hash-password = "ocpp_broker.auth:hash_password_cli"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Correctness only (pycodestyle errors + pyflakes). Style rules are not enforced;
# E501 is ignored because the code base has long lines throughout.
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = true  # motor and friends ship no stubs
warn_unused_ignores = true
