[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocpp-broker"
version = "0.2.0A"
description = "A middleware OCPP broker for forwarding messages between chargers and backends"
authors = [
  { name = "Abhas Dudeja", email = "amdudeja@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"

[project.dependencies]
websockets = ">=11.0"
pyyaml = ">=6.0"
fastapi = ">=0.110.0"
uvicorn = ">=0.29.0"

[tool.setuptools.package-data]
"ocpp_broker" = ["docs/*.md"]
